[workspace]
resolver = "2"
members = [
    "contracts/soulbound-token",
    "contracts/credential-registry",
    "contracts/reputation-score",
    "contracts/identity-aggregator",
]

[workspace.dependencies]
soroban-sdk = { version = "21.7.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
